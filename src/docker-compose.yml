services:
  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data

  paddleocr-service:
    build: ./backend/paddleocr_service
    ports:
      - "8900:8900"
    volumes:
      - paddleocr-models:/models
    restart: unless-stopped

volumes:
  redis-data: {}
  paddleocr-models: {}
